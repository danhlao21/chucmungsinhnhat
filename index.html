<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            color: #fff;
        }

        /* --- MÀN HÌNH CHỜ MỞ QUÀ --- */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease, visibility 1s;
            cursor: pointer;
        }

        .gift-box {
            font-size: 90px;
            margin-bottom: 25px;
            animation: bounce 1.2s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 20px rgba(255, 65, 108, 0.8));
        }

        .btn-start {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.7);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-start:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 65, 108, 1);
        }

        /* --- THIỆP CHÚC MỪNG --- */
        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 35px 30px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            max-width: 520px;
            width: 90%;
            z-index: 10;
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: floatCard 6s ease-in-out infinite alternate;
        }

        /* KHU VỰC NHẢY MÚA */
        .dance-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .dancer {
            font-size: 50px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        .dancer-left { animation: danceLeft 0.8s infinite alternate ease-in-out; }
        .dancer-center { font-size: 65px; animation: danceCenter 0.6s infinite alternate ease-in-out; }
        .dancer-right { animation: danceRight 0.8s infinite alternate ease-in-out; }

        h1 {
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffd166);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.3rem;
            margin-bottom: 15px;
            font-weight: 800;
        }

        /* PHẦN CHỮ CHẠY TỪ TỪ */
        .typewriter-text {
            color: #f0f0f0;
            font-size: 1.15rem;
            line-height: 1.8;
            min-height: 90px;
            margin-bottom: 10px;
        }

        /* Con trỏ nhấp nháy khi gõ chữ */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.15rem;
            background-color: #ff758c;
            margin-left: 3px;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }

        /* BÓNG BAY BỒNG BỀNH */
        .balloon {
            position: absolute;
            width: 45px;
            height: 60px;
            border-radius: 50%;
            bottom: -100px;
            opacity: 0.7;
            animation: floatBalloon 12s linear infinite;
            pointer-events: none;
        }

        .balloon:nth-child(1) { left: 10%; animation-duration: 11s; background: #ff4081; }
        .balloon:nth-child(2) { left: 25%; animation-duration: 14s; animation-delay: 2s; background: #00e676; }
        .balloon:nth-child(3) { left: 60%; animation-duration: 10s; animation-delay: 1s; background: #ffeb3b; }
        .balloon:nth-child(4) { left: 80%; animation-duration: 13s; animation-delay: 3s; background: #00e5ff; }

        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        /* ANIMATIONS */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes danceLeft {
            0% { transform: translateY(0) rotate(-15deg) scale(1); }
            100% { transform: translateY(-15px) rotate(15deg) scale(1.1); }
        }

        @keyframes danceCenter {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-20px) scale(1.15) rotate(-10deg); }
            100% { transform: translateY(0) scale(1) rotate(10deg); }
        }

        @keyframes danceRight {
            0% { transform: translateY(-15px) rotate(15deg) scale(1.1); }
            100% { transform: translateY(0) rotate(-15deg) scale(1); }
        }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes floatCard {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }

        @keyframes floatBalloon {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHỜ MỞ QUÀ -->
    <div id="start-overlay" onclick="startSurprise()">
        <div class="gift-box">🎁</div>
        <button class="btn-start">✨ BẤM ĐỂ MỞ QUÀ 🎶</button>
    </div>

    <!-- BÓNG BAY PHÔNG NỀN -->
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>

    <canvas id="canvas"></canvas>

    <!-- THIỆP CHÚC MỪNG -->
    <div class="card" id="main-card">
        <div class="dance-container">
            <span class="dancer dancer-left">💃</span>
            <span class="dancer dancer-center">🎂</span>
            <span class="dancer dancer-right">🕺</span>
        </div>
        <h1>Happy Birthday!</h1>
        
        <!-- VÙNG HIỂN THỊ CHỮ CHẠY -->
        <p class="typewriter-text"><span id="typed-text"></span><span class="cursor"></span></p>
    </div>

    <!-- FILE NHẠC TỪ THƯ MỤC DỰ ÁN CỦA BẠN -->
    <audio id="bg-music" loop preload="auto">
        <source src="d:\chumungsinhnhat\file mp3\Happy Birthday to You Always 14 AMEE x Hoàng Dũng x Obito x Hứa Kim Tuyền OFFICIAL LYRIC VIDEO (1).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-music');
        const overlay = document.getElementById('start-overlay');
        const card = document.getElementById('main-card');

        // NỘI DUNG LỜI CHÚC (Bạn có thể sửa lời chúc ở đây)
        const message = "Hello em là anh Danh đây, hôm nay anh chúc mừng sinh nhật em nha, chúc em Hân tuổi mới luôn vui vẻ và luôn thành công trong công việc, luôn luôn xinh đẹp nha✨🎉Dear bé Hân đáng iu :3 ";
        
        let charIndex = 0;
        const typedTextElement = document.getElementById('typed-text');

        // Hàm xử lý chữ chạy từ từ (Typewriter)
        function typeWriter() {
            if (charIndex < message.length) {
                typedTextElement.textContent += message.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 50); // Tốc độ xuất hiện chữ (50ms mỗi chữ)
            }
        }

        function startSurprise() {
            // Phát nhạc local
            audio.play().catch(err => console.log("Lỗi nhạc:", err));

            // Ẩn màn hình chờ
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.visibility = 'hidden', 1000);

            // Hiện thiệp sinh nhật
            card.classList.add('active');

            // Bắt đầu gõ chữ sau khi thiệp hiện ra
            setTimeout(typeWriter, 600);

            // Bắt đầu bắn pháo hoa
            setInterval(createFirework, 350);
        }

        /* --- XỬ LÝ CANVAS PHÁO HOA --- */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.radius = Math.random() * 3 + 1.2;
                this.velocity = {
                    x: (Math.random() - 0.5) * 9,
                    y: (Math.random() - 0.5) * 9
                };
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.012;
            }
        }

        let particles = [];
        const colors = ['#ff4081', '#00e676', '#ffeb3b', '#00e5ff', '#ab47bc', '#ff9800', '#ffffff'];

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.65);
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 45; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });
        }

        animate();
    </script>
</body>
</html>
